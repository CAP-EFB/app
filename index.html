<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Observer Log</title>
  <meta name="description" content="Offline CAP observer mission log, checklist and sketch pad.">
  <meta name="theme-color" content="#edf1f6">
  <meta name="format-detection" content="telephone=no">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Observer Log">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div id="app">
    <header class="topbar">
      <div class="topbar-row">
        <div class="brand">
          <img class="brand-icon cap" src="icons/cap-emblem.svg" alt="Civil Air Patrol" width="40" height="40">
          <div class="brand-text">
            <div class="brand-title">Observer Log</div>
            <div class="brand-sub"><span class="save-dot" id="saveDot"></span><span id="saveLabel">On this device</span></div>
          </div>
        </div>
        <div class="top-actions">
          <button class="icon-btn" type="button" data-act="print" aria-label="Print or save PDF" title="Print / Save PDF">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 9V3h12v6"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/>
            </svg>
          </button>
          <button class="icon-btn" type="button" data-act="menu" aria-label="Menu" title="Logs, export, settings">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
              <path d="M4 7h16M4 12h16M4 17h16"/>
            </svg>
          </button>
        </div>
      </div>
      <button class="mission-strip" type="button" data-act="edit-mission" aria-label="Edit mission details">
        <span class="mission-strip-main" id="stripMain">Untitled mission</span>
        <span class="mission-strip-sub" id="stripSub">Tap to add mission, crew &amp; entry point</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
      </button>
    </header>

    <main class="app-main" id="view"></main>

    <nav class="tabbar" id="tabbar" aria-label="Sections">
      <button type="button" class="tab active" data-tab="log" role="tab" aria-selected="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 6h13M8 12h13M8 18h13"/><path d="M3.5 6h.01M3.5 12h.01M3.5 18h.01"/>
        </svg>
        Log
      </button>
      <button type="button" class="tab" data-tab="times" role="tab" aria-selected="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/>
        </svg>
        Times
      </button>
      <button type="button" class="tab" data-tab="obs" role="tab" aria-selected="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2.5 12S6 5 12 5s9.5 7 9.5 7-3.5 7-9.5 7-9.5-7-9.5-7Z"/><circle cx="12" cy="12" r="2.8"/>
        </svg>
        Obs
      </button>
      <button type="button" class="tab" data-tab="notes" role="tab" aria-selected="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20h9"/><path d="M16.4 3.6a2.1 2.1 0 0 1 3 3L7.5 18.5 3 20l1.5-4.5Z"/>
        </svg>
        Notes
      </button>
    </nav>
  </div>

  <div class="overlay" id="overlay"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div id="print"></div>

  <noscript>
    <div style="padding:24px;font-family:system-ui,sans-serif">
      <h1>Observer Log</h1>
      <p>This app needs JavaScript. Enable it in Settings → Safari → Advanced, then reload.</p>
    </div>
  </noscript>

  <script src="app.js"></script>
</body>
</html>
